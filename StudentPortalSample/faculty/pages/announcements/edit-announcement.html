<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Announcement | Cebu Eastern College</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/announcements.css">
    <style>
        .toast-wrap {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 8px;
            color: #FFFFFF;
            background: #177245;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            animation: toastIn 0.3s ease;
            pointer-events: auto;
        }

        .toast.error {
            background: #B3261E;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .btn-post:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
    </style>
    <link rel="stylesheet" href="../../../css/responsive.css">
    <link rel="stylesheet" href="../../css/faculty-theme.css">
    <script src="../../js/i18n.js"></script>
    <script src="../../js/preferences.js"></script>
</head>
<body class="dashboard-page" data-portal="faculty">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <strong>CEC</strong>
            <span data-i18n="brand.portal">FACULTY PORTAL</span>
        </div>

        <nav class="sidebar-nav" aria-label="Faculty navigation">
            <div class="nav-section" data-i18n="nav.section.classes">My Classes</div>
            <a href="../dashboard/faculty-dashboard.html"><i class="fa-solid fa-gauge-high"></i><span data-i18n="nav.dashboard">Dashboard</span></a>
            <a href="../schedule/schedule-day.html"><i class="fa-regular fa-calendar-day"></i><span data-i18n="nav.schedule">My Schedule</span></a>
            <a href="../classes/class-list.html"><i class="fa-solid fa-table-list"></i><span data-i18n="nav.classes">Class List</span></a>
            <a href="../assignments/assignments.html"><i class="fa-solid fa-list-check"></i><span data-i18n="nav.assignments">Assignments</span></a>

            <div class="nav-section" data-i18n="nav.section.students">Students</div>
            <a href="../students/student-records.html"><i class="fa-solid fa-users"></i><span data-i18n="nav.students">Student List</span></a>
            <a href="../grades/grade-management.html"><i class="fa-solid fa-file-pen"></i><span data-i18n="nav.grades">Grades</span></a>
            <a href="../attendance/attendance-dashboard.html"><i class="fa-solid fa-clipboard-check"></i><span data-i18n="nav.attendance">Attendance</span></a>

            <div class="nav-section" data-i18n="nav.section.academic">Academic</div>
            <a href="announcements.html" class="active"><i class="fa-solid fa-bullhorn"></i><span data-i18n="nav.announcements">Announcements</span></a>
            <a href="../dashboard/upcoming-deadlines.html"><i class="fa-regular fa-clock"></i><span data-i18n="nav.deadlines">Upcoming Deadlines</span></a>

            <div class="nav-section" data-i18n="nav.section.personal">Personal</div>
            <a href="../profile/profile.html"><i class="fa-regular fa-user"></i><span data-i18n="nav.profile">Profile</span></a>
            <a href="../settings/settings.html"><i class="fa-solid fa-gear"></i><span data-i18n="nav.settings">Settings</span></a>
        </nav>

    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <label class="search-box">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" data-i18n-placeholder="header.search" aria-label="Search" data-i18n-aria="header.search" placeholder="Search courses, sections or anything...">
            </label>

            <button class="header-icon" type="button" data-i18n-aria="header.notifications" aria-label="Notifications">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                <span class="notif-dot"></span>
            </button>

            <button class="profile-button" type="button">
                <span class="profile-avatar">CB</span>
                <span class="profile-info">
                    <strong>Mr. Charles Bacus</strong>
                    <small data-i18n="header.role">Faculty</small>
                </span>
            </button>
        </header>

        <section class="dashboard-content">
            <a href="announcements.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Announcements</a>
            <div class="page-head">
                <h1><span data-i18n="page.announcement.edit">Edit Announcement</span></h1>
                <p class="page-desc"><span data-i18n="page.announcement.edit.desc">Update the announcement you created.</span></p>
            </div>

            <form id="announcement-form" class="form-card" novalidate>
                <div class="form-body">
                    <div class="form-field">
                        <label class="form-label" for="announcement-title">Title <span class="required">*</span></label>
                        <input type="text" id="announcement-title" class="form-input" placeholder="No Class on Aug 12">
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="announcement-message">Message <span class="required">*</span></label>
                        <textarea id="announcement-message" class="form-textarea" placeholder="Write your message here..."></textarea>
                    </div>

                    <div class="form-field field-section">
                        <label class="form-label" for="announcement-audience">Target Audience <span class="required">*</span></label>
                        <select id="announcement-audience" class="form-select">
                            <option value="" disabled>Select target audience</option>
                            <option value="Students">Students</option>
                            <option value="Faculty &amp; Students">Faculty &amp; Students</option>
                        </select>
                        <p class="helper-text">(Select at least 1 option)</p>
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="announcement-priority">Priority</label>
                        <select id="announcement-priority" class="form-select">
                            <option>Normal</option>
                            <option>High</option>
                            <option>Low</option>
                        </select>
                    </div>
                </div>

                <div class="form-footer">
                    <a href="announcements.html" class="btn-outline">Cancel</a>
                    <button type="submit" class="btn-post" id="post-btn"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
                </div>
            </form>
        </section>
    </main>

    <div class="toast-wrap" id="toast-wrap"></div>

    <script src="../../../js/announcement-store.js"></script>

<script src="../../js/validateForm.js"></script>
<script src="../../js/persistSelect.js"></script>
<script src="../../js/setYear.js"></script>

    <script src="../../js/notificationMenu.js"></script>
    <script src="../../js/profileMenu.js"></script>
    <script src="../../../js/auth.js"></script>
    <script src="../../../js/session-guard.js"></script>
    </body>
</html>
