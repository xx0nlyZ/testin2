<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | CEC Registrar Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../css/reg-dashboard.css">
    <link rel="stylesheet" href="../../css/reg-analytics.css">
    <link rel="stylesheet" href="../../css/reg-enrollment.css">
    <link rel="stylesheet" href="../../css/reg-theme.css">
    <link rel="stylesheet" href="../../css/reg-announcements.css">
    <link rel="stylesheet" href="../../../css/responsive.css">
    <script src="../../js/i18n.js"></script>
    <script src="../../js/preferences.js"></script>
</head>
<body class="dashboard-page" data-portal="registrar">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <strong>CEC</strong>
            <span data-i18n="brand.portal">REGISTRAR PORTAL SYSTEM</span>
        </div>

        <nav class="sidebar-nav" aria-label="Registrar navigation">
            <a href="../../pages/dashboard/registrar.html"><i class="fa-solid fa-gauge-high"></i><span data-i18n="nav.dashboard">Dashboard</span></a>
            <a href="../student-record/student-records.html"><i class="fa-solid fa-users"></i><span data-i18n="nav.records">Student Records</span></a>
            <a href="../enrollment-management/enrollment-management.html"><i class="fa-regular fa-file-lines"></i><span data-i18n="nav.enrollment">Enrollment Management</span></a>
            <a href="../enrollment-management/enrollment-application.html"><i class="fa-regular fa-square-plus"></i><span data-i18n="nav.enrollment.application">Enrollment Application</span></a>
            <a href="../report/reports.html"><i class="fa-solid fa-chart-simple"></i><span data-i18n="nav.reports">Reports</span></a>
            <a href="../document-request/index.html"><i class="fa-regular fa-folder-open"></i><span data-i18n="nav.documents">Document Requests</span></a>
            <a href="index.html" class="active"><i class="fa-solid fa-bullhorn"></i><span data-i18n="nav.announcements">Announcements</span></a>
        </nav>

        <div class="sidebar-bottom">
            <a href="../settings/settings.html"><i class="fa-solid fa-gear"></i><span data-i18n="nav.settings">Settings</span></a>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="app-header">
            <button class="menu-toggle" type="button" id="menu-toggle" aria-label="Toggle sidebar" data-i18n-aria="header.toggle.sidebar"><i class="fa-solid fa-bars"></i></button>

            <label class="search-box">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" placeholder="Search subjects, records, or anything..." aria-label="Search" data-i18n-placeholder="header.search">
            </label>

            <button class="header-icon" type="button" aria-label="Notifications" data-i18n-aria="header.notifications">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
                <span class="notif-dot"></span>
            </button>

            <button class="profile-button" type="button">
                <span class="profile-avatar">&mdash;</span>
                <span class="profile-info">
                    <strong></strong>
                    <small data-i18n="header.role">Registrar</small>
                </span>
            </button>
        </header>

        <section class="announce-content">
            <div class="page-head">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../../pages/dashboard/registrar.html"><span data-i18n="breadcrumb.dashboard">Dashboard</span></a>
                    <i class="fa-solid fa-chevron-right"></i>
                    <span>Announcements</span>
                </nav>
            </div>

            <section class="summary-card" aria-label="Announcements summary">
                <div class="announce-summary-head">
                    <h1><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Announcements</h1>
                    <div class="announce-summary-actions">
                        <a class="announce-view-all" href="all.html">
                            View All <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
                        </a>
                        <a class="btn btn-primary" href="create.html">
                            <i class="fa-solid fa-plus" aria-hidden="true"></i> Create Announcement
                        </a>
                    </div>
                </div>

                <div class="tab-bar" role="tablist" aria-label="Announcement groups">
                    <button type="button" class="tab-btn active" role="tab" aria-selected="true" data-tab="official"><i class="fa-solid fa-bullhorn" aria-hidden="true"></i> Official Announcements</button>
                    <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="mine"><i class="fa-regular fa-user" aria-hidden="true"></i> My Announcements</button>
                </div>

                <ul class="announce-list" id="announce-list">
                </ul>
            </section>
        </section>
    </main>

    <script>
        (function () {
            var toggle = document.getElementById('menu-toggle');
            toggle.addEventListener('click', function () {
                document.body.classList.toggle('sidebar-collapsed');
            });
        })();
    </script>
    <script src="../../../js/announcement-store.js"></script>
    <script src="../../js/announcements.js"></script>
    <script src="../../js/notificationMenu.js"></script>
    <script src="../../js/profileMenu.js"></script>
    <script src="../../../js/auth.js"></script>
    <script src="../../../js/session-guard.js"></script>
    </body>
</html>
